# =====================================================================
# Enterprise Spring Boot Configuration
# =====================================================================
server:
  port: 8080
  shutdown: graceful # Pod/Container durdurulurken aktif istekleri guvenle tamamla

spring:
  application:
    name: core-api-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Java 21 Project Loom - Sanal Is Parcaciklari (Virtual Threads)
  threads:
    virtual:
      enabled: true

  # Docker Compose Destegi
  docker:
    compose:
      enabled: true
      file: compose.yaml
      lifecycle-management: start-and-stop

  # Veritabani ve HikariCP Baglanti Havuzu (Yerel Gelistirme Varsayilanlari & Canli Ortam Ezmesi)
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:core_api_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: EnterpriseHikariPool

  # Spring Data JPA / Hibernate Standartlari
  jpa:
    open-in-view: false # Kritik: Anti-pattern ve sizintilari onlemek icin daima false!
    hibernate:
      ddl-auto: validate # Asla update/create degil; sema kontrolu sadece Flyway ile yapilir!
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 25 # N+1 sorgu problemini engeller
        default_schema: public
        jdbc.time_zone: UTC
        order_inserts: true
        order_updates: true

  # Flyway Sema Surumleme
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false # Sırasız çalıştırmayı engelle

  # OAuth2 Client (Google & GitHub Kimlik Federasyonu)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          github:
            client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
            scope:
              - read:user
              - user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"


# Observability: Actuator & Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true # Kubernetes Liveness & Readiness destegi
  metrics:
    tags:
      application: ${spring.application.name}

# Springdoc Swagger UI Yapilandirmasi
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# Logging: Dağıtık İzleme (TraceId) Logback Deseni
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

# SSO & Kimlik Federasyonu (Google & GitHub) Yapilandirmasi
sso:
  issuer-url: ${SSO_ISSUER_URL:http://localhost:8080}
  keystore:
    location: classpath:keystore/auth-server.p12
    password: ${KEYSTORE_PASSWORD:enterprise_sso_secret_2026}
    alias: ${KEYSTORE_KEY_ALIAS:sso-jwt-key}
    key-password: ${KEYSTORE_KEY_PASSWORD:enterprise_sso_secret_2026}
  token:
    access-token-time-to-live: 10m
    refresh-token-time-to-live: 30d