name: Enterprise Spring Boot CI & Quality Gate

on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]

permissions:
  contents: read

jobs:
  # =====================================================================
  # Job 1: Build, Test & Container Verification (Quality Gate)
  # =====================================================================
  build-and-verify:
    name: Build & Test (Java 21 + Testcontainers)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21 LTS (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Build & Integration Tests (PostgreSQL Testcontainers)
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify -B

      - name: Verify Multi-Stage Dockerfile Build
        run: |
          docker build -t core-api-service:ci-test .